<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Days Gone Achievement Tracker</title>
  <style>
    :root {
      color-scheme: dark;
      --splash-text: #eee8dc;
      --splash-muted: #aaa294;
      --splash-track: rgba(20, 18, 14, 0.84);
      --splash-border: rgba(197, 107, 54, 0.42);
      --splash-fill: #d77b42;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .splash__art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .splash__runtime {
      position: absolute;
      left: 50%;
      bottom: 64px;
      width: min(390px, 48%);
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
    }

    .splash__brand {
      position: absolute;
      left: 54px;
      top: 48px;
      display: grid;
      gap: 4px;
      color: var(--splash-text);
      text-shadow: 0 2px 10px rgba(0, 0, 0, .92);
    }

    .splash__brand strong {
      font-size: 38px;
      line-height: 1;
      letter-spacing: .14em;
    }

    .splash__brand span {
      color: var(--splash-fill);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .28em;
    }

    .splash__progress {
      height: 4px;
      overflow: hidden;
      border: 1px solid var(--splash-border);
      border-radius: 999px;
      background: var(--splash-track);
    }

    .splash__progress-fill {
      width: 5%;
      height: 100%;
      border-radius: inherit;
      background: var(--splash-fill);
      transition: width 220ms ease-out;
    }

    .splash__status {
      margin-top: 11px;
      color: var(--splash-text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1.4;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
    }

    @media (prefers-reduced-motion: reduce) {
      .splash__progress-fill {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="splash" aria-label="Days Gone Achievement Tracker loading">
    <img class="splash__art" src="assets/splash-road.webp" alt="Days Gone Achievement Tracker">
    <div class="splash__brand" aria-hidden="true">
      <strong>DAYS GONE</strong>
      <span>ACHIEVEMENT TRACKER</span>
    </div>
    <section class="splash__runtime" aria-live="polite">
      <div id="splashProgress" class="splash__progress" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5">
        <div id="splashProgressFill" class="splash__progress-fill"></div>
      </div>
      <div id="splashStatus" class="splash__status">Starting achievement tracker…</div>
    </section>
  </main>
  <script src="splash.js"></script>
</body>
</html>
